name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    env:
      TURKCE_DUYGU_INDIRME: "0"
      TURKCE_USLUP_INDIRME: "0"
      SESLEN_TTS_INDIRME: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # kardeş paketler GitHub'dan: PyPI'da henüz yoklarken de, sonra da en son sürümle sınanır
      - run: pip install "turkce-normalize @ git+https://github.com/seslen-tr/turkce-normalize" "turkce-vurgu @ git+https://github.com/seslen-tr/turkce-vurgu"
      - run: pip install -e . pytest
      - run: pytest -q
